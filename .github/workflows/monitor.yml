name: Otsuka monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: otsuka-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Zabrat kod i bazu
        uses: actions/checkout@v4

      - name: Proverit magazin
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python3 .github/workflows/check.py

      - name: Sohranit bazu tovarov
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name  "otsuka-monitor"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "state update"
            git push
          else
            echo "izmeneniy net"
          fi
