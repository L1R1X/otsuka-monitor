name: Otsuka monitor

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: otsuka-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Проверить каталоги и отправить уведомления
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          save_state() {
            if [[ -z "$(git status --porcelain -- state.json)" ]]; then
              return 0
            fi
            git add -- state.json
            git commit -m "state update"
            git push origin HEAD:main
          }

          git config user.name "otsuka-monitor"
          git config user.email "actions@github.com"

          scan_status=0
          # Оставляем время на отправку уже сохранённых уведомлений.
          timeout 7m python3 -B check.py || scan_status=$?
          save_state

          delivery_status=0
          python3 -B check.py --deliver || delivery_status=$?
          save_state

          if (( scan_status != 0 || delivery_status != 0 )); then
            exit 1
          fi
